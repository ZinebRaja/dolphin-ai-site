    <!-- Structured data: FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Dolphin AI, and what does it actually do?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dolphin AI turns messy spend data into a clean, classified view of what you buy, where the money goes, and which suppliers/vendors you rely on. We can pull data from any source, including ERP systems, spreadsheets, supply chain platforms, AP and invoice systems, and other databases. Our solution then cleans and standardizes supplier/vendor names and descriptions and categorizes every line of spend. With that clarity, your team can negotiate better contracts, bring tail spend under control, consolidate suppliers/vendors, and cut the hours spent on manual data work."
          }
        },
        {
          "@type": "Question",
          "name": "What kind of data do we need to provide, and can Dolphin AI work with messy or incomplete data?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dolphin AI primarily works with supplier/vendor and spend-related data, such as supplier/vendor names, product or service descriptions, transaction details, categories, quantities, and spend amounts. Business data often contains inconsistent supplier/vendor names, formatting differences, or missing information. Dolphin AI cleans, normalizes and structures the available data before analysis to create a more consistent and usable dataset."
          }
        },
        {
          "@type": "Question",
          "name": "How does Dolphin AI classify spend?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dolphin AI matches each transaction's description to the available taxonomy and assigns it to a category across four levels. When a description isn't available, our AI looks at what the supplier/vendor does and classifies based on that business activity. If a supplier covers several categories, the spend is marked as unclassified and left for your review. Once you provide a description, it can be classified. Every classification comes with its reasoning, even for tail spend, so you can see exactly why it was assigned."
          }
        },
        {
          "@type": "Question",
          "name": "How can Dolphin AI help us reduce costs and negotiate better with suppliers/vendors?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "By creating a clearer view of supplier/vendor relationships and historical spending, Dolphin AI can help businesses identify areas that deserve further investigation, such as fragmented spending, high-spend categories, supplier/vendor consolidation opportunities, or potential sourcing improvements. This gives decision-makers a stronger fact base when negotiating pricing, volumes, commercial terms, or future agreements with suppliers/vendors."
          }
        },
        {
          "@type": "Question",
          "name": "What benefits does Dolphin AI deliver?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dolphin AI turns spend data from something your team has to wrestle with into something you can act on. The major areas of value are: Data you can trust — clean, consistent, classified spend data, with the reasoning behind every classification, so decisions rest on facts instead of guesswork. Stronger negotiations — see exactly what you buy and from whom, and walk into supplier/vendor conversations with the evidence to ask for better terms. Tail spend under control — the small, scattered purchases that usually slip through the cracks finally get visibility and management. Smarter supplier/vendor consolidation — spot where many suppliers/vendors serve the same need and build leverage with fewer, stronger relationships."
          }
        },
        {
          "@type": "Question",
          "name": "How much labor cost and how many hours can Dolphin AI save our team?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Think about how much of your team's week disappears into exporting spend data, cleaning it, matching supplier/vendor names and re-categorizing everything in spreadsheets. That's skilled people doing repetitive work, and it's expensive. Dolphin AI takes that work over, so you save labor hours and labor cost: you need fewer people, or far fewer hours, on manual data work, and your team can spend their time on sourcing, negotiation and decisions instead. Our ROI calculator shows what that's worth for your own team size, hourly rate and weekly hours."
          }
        },
        {
          "@type": "Question",
          "name": "Can Dolphin AI work with our existing categories and business structure?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The objective is to organize data in a way that is meaningful for the business. If an organization already has established categories or a taxonomy, this can be considered when structuring its spend data. The exact taxonomy setup and customization requirements would be agreed upon as part of implementation."
          }
        },
        {
          "@type": "Question",
          "name": "How do we see and use the results?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dolphin AI delivers your data in dashboard form, with standard visualizations that cover the requirements most teams have for running the business and making decisions. Your organization stays in control of who has access to the dashboards."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take to implement Dolphin AI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Implementation is designed to be quick and streamlined. The timeline depends on data volume, complexity, and integration requirements, but Dolphin AI can rapidly process and analyze your spend data so your team can begin identifying opportunities without a lengthy implementation process."
          }
        },
        {
          "@type": "Question",
          "name": "How secure is our data with Dolphin AI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We take the security of our clients' data seriously. Dolphin AI is built and hosted in a certified, enterprise-grade cloud environment that follows leading industry security and compliance standards, and your data is never shared with third parties. For enterprise implementations, we work with your technical team to align with your organization's security policies."
          }
        },
        {
          "@type": "Question",
          "name": "How much does Dolphin AI cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dolphin AI offers subscription plans based on the size of your annual spend, so the plan fits your organization. Our ROI calculator gives you an estimate of the value for your own numbers and a recommended plan for your spend. For specifics, book a demo or request a free estimate and we will walk you through the options."
          }
        },
        {
          "@type": "Question",
          "name": "Can't we just use a general AI tool and a prompt to do this?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AI is changing how businesses work, but a single prompt cannot produce a complete, reliable solution for a specific business problem. Spend analysis needs data connected and synced across one or many systems, classification you can trust with clear reasoning, and secure handling of your supplier/vendor and spend data. Dolphin AI is purpose-built for this, combining AI models with the data pipelines, security and dashboards that turn raw spend data into a reliable, repeatable solution."
          }
        }
      ]
    }
